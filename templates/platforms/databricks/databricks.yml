# Databricks Asset Bundle for {{project}}.
# Deploy: databricks bundle deploy -t dev · Run: databricks bundle run train -t dev
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: {{project}}

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog for tables and the registered model
    default: {{catalog}}
  schema:
    description: Unity Catalog schema for tables and the registered model
    default: {{schema}}
  training_table:
    description: Training table name inside catalog.schema
    default: training
  scoring_table:
    description: Latest scoring batch table inside catalog.schema (monitoring)
    default: scoring_batch

targets:
  dev:
    # Development mode prefixes resources with [dev <user>] and pauses schedules.
    mode: development
    default: true
    # workspace:
    #   host: https://<your-workspace>.cloud.databricks.com
    variables:
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    # workspace:
    #   host: https://<your-workspace>.cloud.databricks.com
    #   root_path: /Workspace/Users/<service-principal-or-user>/.bundle/${bundle.name}/${bundle.target}
    # permissions:
    #   - group_name: ml-engineers
    #     level: CAN_MANAGE
