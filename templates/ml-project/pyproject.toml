[project]
name = "{{project}}"
version = "0.1.0"
description = "{{description}}"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "mlflow>=3.5",
]

[project.optional-dependencies]
databricks = ["databricks-connect>=15.4", "databricks-sdk>=0.30"]

[project.scripts]
# Entry points used by Databricks wheel tasks (databricks.yml) and handy locally.
{{pkg}}-eda = "{{pkg}}.analysis.eda:main"
{{pkg}}-tune = "{{pkg}}.models.tune:main"
{{pkg}}-train = "{{pkg}}.models.train:main"
{{pkg}}-eval = "{{pkg}}.evaluation.run:main"
{{pkg}}-promote = "{{pkg}}.registry.promote:main"
{{pkg}}-monitor = "{{pkg}}.monitoring.run:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{pkg}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: data-contract tests (make data-check)", "slow: long-running tests", "mlflow: tests that use a temporary MLflow tracking store"]
addopts = "-q -m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning:mlflow.*"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD"]
ignore = ["PD101"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src"]
