[project]
name = "{{project}}"
version = "0.1.0"
description = "{{description}}"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{pkg}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: data-contract tests (make data-check)", "slow: long-running tests"]
addopts = "-q -m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src"]
