name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  playbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: pip install ruff
      - run: python -m unittest discover -s tests -v
  scaffolded-ml-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python3 scripts/playbook.py new /tmp/demo --name demo-model --bootstrap
      - run: make -C /tmp/demo data-check gate
